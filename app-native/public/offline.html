<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friendly</title>
<style>
  :root{--bg:#BFE7C6;--ink:#2A2019;--accent:#FF6B57}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,system-ui,sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .dot{width:88px;height:88px;border-radius:50%;background:#FFC145;position:relative;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .dot i{position:absolute;top:30px;width:9px;height:14px;border-radius:50%;background:var(--ink)} .dot i:first-child{left:26px} .dot i:last-child{right:26px}
  h1{font-size:24px;margin:0 0 6px} p{margin:0 0 20px;max-width:28ch}
  button{font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:12px 26px}
</style></head>
<body><div class="wrap"><div class="dot"><i></i><i></i></div>
<h1>No connection</h1><p>Friendly needs the internet the very first time it opens. After that it works offline too.</p>
<button onclick="location.href='https://officialfriendly.com/'">Try again</button></div></body></html>
