<style>
/* Painted before any file has downloaded. When iOS kills the page (memory) and it reloads, or on a slow start,
   this is what shows instead of a blank green screen: the intro's gradient with a still Dot. */
body{margin:0;background:#BFE7C6}
.splash{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;background:linear-gradient(160deg,#BFE7C6,#7CC79B 55%,#1F5A3A)}
.boot-dot{width:112px;height:112px}
</style>
<script>
// Load the app at the version named in version.json, fetched fresh every open (the page itself may sit in a
// 10-minute CDN or WebView cache; the versioned asset URLs never do). The check never blocks: it waits at most
// 1.5 seconds and otherwise starts with the last version this device saw. It used to be a synchronous request,
// which froze the app on the green screen for as long as a slow network took to answer (and the font
// stylesheet above blocked startup the same way, so it now loads in the background too).
(function(){
  var known = "61"; try { known = localStorage.getItem("friendlyV") || known; } catch (e) {}
  var started = false;
  function start(v) {
    if (started) return; started = true; v = String(v || known);
    try { localStorage.setItem("friendlyV", v); } catch (e) {}
    var go = false, scripts = function () { if (go) return; go = true;
      var b = document.createElement("script"); b.src = "./blip.js?v=" + v; b.async = false; document.head.appendChild(b);
      var a = document.createElement("script"); a.type = "module"; a.src = "./app.js?v=" + v; a.async = false; document.head.appendChild(a); };
    var l = document.createElement("link"); l.rel = "stylesheet"; l.href = "./styles.css?v=" + v; l.onload = scripts; l.onerror = scripts; document.head.appendChild(l);
    setTimeout(scripts, 3000);   // styles first so nothing shows unstyled, but never wait on them forever
  }
  var timer = setTimeout(function () { start(known); }, 1500);
  try {
    fetch("./version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.v) return;
      if (!started) { clearTimeout(timer); start(j.v); } else { try { localStorage.setItem("friendlyV", String(j.v)); } catch (e) {} }
    }).catch(function () {});
  } catch (e) { start(known); }
})();
</script>
</head>
<body>
<div id="app"><div class="splash"><svg class="boot-dot" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 9c25 0 42 17 42 42S75 92 50 92 8 76 8 51 25 9 50 9z" fill="#FFC145"/><ellipse cx="36" cy="46" rx="4.6" ry="7.2" fill="#2A2019"/><ellipse cx="64" cy="46" rx="4.6" ry="7.2" fill="#2A2019"/><circle cx="37.5" cy="43" r="1.7" fill="#fff"/><circle cx="65.5" cy="43" r="1.7" fill="#fff"/><circle cx="25" cy="60" r="5.5" fill="#FF6B57" opacity=".55"/><circle cx="75" cy="60" r="5.5" fill="#FF6B57" opacity=".55"/><path d="M41 63q9 8 18 0" stroke="#2A2019" stroke-width="3.2" fill="none" stroke-linecap="round"/></svg></div></div>
<div id="toast" role="status"></div>
<!-- ?v= is bumped with the service-worker CACHE version on every deploy so the
     CDN (10-minute cache) can never pair a new index.html with an old script. -->

</body>
